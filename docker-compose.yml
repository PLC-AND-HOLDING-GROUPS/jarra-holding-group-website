services:
  db:
    image: postgres:16-alpine
    container_name: mom_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ${DB_NAME:-mom_website}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mom_backend
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - DB_NAME=${DB_NAME:-mom_website}
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=https://www.mom.gov.et
      - TZ=UTC
      - APP_TIMEZONE=Africa/Addis_Ababa
    expose:
      - "4000"
    depends_on:
      - db
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BASE_URL=https://www.mom.gov.et/api
        - NEXT_PUBLIC_BASE=https://www.mom.gov.et
        - NEXT_PUBLIC_TIMEZONE=Africa/Addis_Ababa
    container_name: mom_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_BASE_URL=https://www.mom.gov.et/api
      - NEXT_PUBLIC_BASE=https://www.mom.gov.et
      - NEXT_PUBLIC_TIMEZONE=Africa/Addis_Ababa
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=https://www.mom.gov.et/api/auth
      - NEXTAUTH_SECRET=${AUTH_SECRET}
      - NEXTAUTH_URL=https://www.mom.gov.et/api/auth
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:stable-alpine
    container_name: mom_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx-https.conf:ro
      - ./nginx/nginx-http.conf:/etc/nginx/nginx-http.conf:ro
      - ./nginx/start.sh:/start.sh:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    command: /bin/sh /start.sh
    depends_on:
      - frontend
      - backend

  certbot:
    image: certbot/certbot:latest
    container_name: mom_certbot
    environment:
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
      - CERTBOT_DOMAIN=www.mom.gov.et
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./nginx/certbot-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: /bin/sh /entrypoint.sh
    depends_on:
      - nginx

volumes:
  postgres_data:

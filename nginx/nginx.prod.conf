server {
    listen 80;
    server_name jarra.system.com.et;

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    # HTTP to HTTPS redirect
    location / {
        return 301 https://$host$request_uri;
    }

    location = /health {
        auth_basic off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    # HTTPS Configuration (Uncomment and configure AFTER obtaining SSL)
    # ssl_certificate /etc/letsencrypt/live/jarra.system.com.et/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jarra.system.com.et/privkey.pem;

    auth_basic "Jarra Holding Group - Restricted Access";
    auth_basic_user_file /etc/nginx/templates/.htpasswd;

    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    location = /health {
        auth_basic off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Allow public access to manifest and static files to avoid 401 console errors
    location /favicon_io/ {
        auth_basic off;
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
    }

    location = /favicon.ico {
        auth_basic off;
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
    }

    location = /site.webmanifest {
        auth_basic off;
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ ^/api/auth/(login|logout|request-otp|verify-otp|reset-password) {
        auth_basic off;
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth {
        auth_basic off;
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        auth_basic off;
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads {
        auth_basic off;
        proxy_pass http://backend:4000/uploads;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 100M;
}
